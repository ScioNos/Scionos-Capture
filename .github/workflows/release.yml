name: Verify release package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-scaling:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --grep "@windows-scaling"

  release:
    needs: windows-scaling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      # Releases are published manually with the ScioNos account after these checks pass.
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: scionos-capture-${{ github.ref_name }}
          path: |
            dist/scionos-capture-${{ github.ref_name }}.zip
            dist/scionos-capture-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error
