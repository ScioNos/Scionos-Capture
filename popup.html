<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scionos Capture</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #07111f;
      --panel: #101d2f;
      --panel-hover: #172942;
      --line: #31435b;
      --text: #f8fafc;
      --muted: #a9bad0;
      --cyan: #38bdf8;
      --cyan-deep: #075985;
      --amber: #fbbf24;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      overflow: hidden;
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 105% -5%, rgba(56, 189, 248, 0.18), transparent 38%),
        var(--ink);
      color: var(--text);
    }

    button { font: inherit; }

    button:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 2px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      position: relative;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid var(--cyan);
      pointer-events: none;
    }

    .brand-mark::before { clip-path: polygon(0 0, 38% 0, 38% 2px, 2px 2px, 2px 38%, 0 38%); }
    .brand-mark::after { transform: rotate(180deg); clip-path: polygon(0 0, 38% 0, 38% 2px, 2px 2px, 2px 38%, 0 38%); }
    .brand-mark img { width: 24px; height: 24px; }

    .brand-copy { min-width: 0; }
    .brand-copy h1 { margin: 0; font-size: 16px; line-height: 1.1; letter-spacing: -0.02em; }
    .brand-copy p { margin: 3px 0 0; color: var(--muted); font: 600 10px/1.2 ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; }

    .language-switcher { position: relative; margin-left: auto; }
    .language-button {
      min-width: 58px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }
    .language-button:hover { border-color: var(--cyan); background: var(--panel-hover); }
    .language-button img, .language-option img { width: 24px; height: 16px; border-radius: 2px; }
    .language-code { font: 700 11px/1 ui-monospace, monospace; }
    .chevron { color: var(--muted); font-size: 10px; }

    .language-menu {
      position: absolute;
      z-index: 20;
      top: calc(100% + 7px);
      right: 0;
      width: 226px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0c1828;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.48);
    }
    .language-menu[hidden] { display: none; }
    .language-option {
      width: 100%;
      min-height: 40px;
      display: grid;
      grid-template-columns: 26px 1fr 18px;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .language-option:hover, .language-option:focus-visible { background: var(--panel-hover); }
    .language-option .auto-icon { color: var(--cyan); text-align: center; font-size: 18px; }
    .language-label { font-size: 12px; }
    .language-check { color: var(--cyan); font-weight: 800; }

    .status {
      display: none;
      margin: 12px 0 0;
      padding: 10px 12px;
      border: 1px solid var(--cyan-deep);
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.1);
      color: #7dd3fc;
      font-size: 12px;
      line-height: 1.4;
    }
    .status.visible { display: block; }
    .status.error { border-color: #9f1239; background: rgba(244, 63, 94, 0.1); color: #fecdd3; }

    .capture-list { display: grid; gap: 10px; margin-top: 14px; }
    .capture-button {
      width: 100%;
      min-height: 64px;
      display: grid;
      grid-template-columns: 38px 1fr 18px;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(110deg, var(--panel), #0d1929);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }
    .capture-button:hover { border-color: var(--cyan); background: var(--panel-hover); transform: translateY(-1px); }
    .capture-button:disabled { opacity: 0.55; cursor: wait; transform: none; }
    .capture-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 8px;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.08);
    }
    .capture-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .capture-copy { min-width: 0; }
    .capture-title { display: block; font-size: 13px; font-weight: 720; }
    .capture-description { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .capture-arrow { color: var(--cyan); font-size: 18px; }

    .footer {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
    }
    .shortcut-button {
      display: inline-flex;
      align-items: center;
      padding: 0;
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      border-radius: 5px;
    }
    .shortcut-button:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }
    kbd {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: var(--panel);
      color: var(--text);
      font: 700 10px/1.2 ui-monospace, monospace;
      transition: border-color 150ms ease, color 150ms ease;
    }
    .shortcut-button:hover kbd {
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .shortcut-button.unconfigured kbd {
      border-color: var(--amber);
      border-style: dashed;
      color: var(--amber);
    }
    .shortcut-button.unconfigured:hover kbd {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand-mark"><img src="images/icon48.png" alt=""></div>
    <div class="brand-copy"><h1>Scionos Capture</h1><p id="brand-tagline"></p></div>
    <div class="language-switcher">
      <button id="language-button" class="language-button" type="button" aria-haspopup="menu" aria-expanded="false">
        <img id="language-flag" src="images/flags/fr.svg" alt="">
        <span id="language-code" class="language-code">FR</span><span class="chevron" aria-hidden="true">▼</span>
      </button>
      <div id="language-menu" class="language-menu" role="menu" hidden>
        <button class="language-option" type="button" role="menuitemradio" data-language-mode="auto"><span class="auto-icon" aria-hidden="true">◎</span><span class="language-label" data-i18n="languageAuto">Automatique — langue du navigateur</span><span class="language-check"></span></button>
        <button class="language-option" type="button" role="menuitemradio" data-language-mode="fr"><img src="images/flags/fr.svg" alt=""><span class="language-label">Français</span><span class="language-check"></span></button>
        <button class="language-option" type="button" role="menuitemradio" data-language-mode="en"><img src="images/flags/en.svg" alt=""><span class="language-label">English</span><span class="language-check"></span></button>
        <button class="language-option" type="button" role="menuitemradio" data-language-mode="es"><img src="images/flags/es.svg" alt=""><span class="language-label">Español</span><span class="language-check"></span></button>
        <button class="language-option" type="button" role="menuitemradio" data-language-mode="de"><img src="images/flags/de.svg" alt=""><span class="language-label">Deutsch</span><span class="language-check"></span></button>
      </div>
    </div>
  </header>

  <div id="status" class="status" role="status" aria-live="polite"></div>

  <main class="capture-list">
    <button id="btn-full" class="capture-button" type="button">
      <span class="capture-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3M7 12h10M12 7v10"/></svg></span>
      <span class="capture-copy"><span id="txt-full-title" class="capture-title"></span><span id="txt-full-desc" class="capture-description"></span></span><span class="capture-arrow" aria-hidden="true">›</span>
    </button>
    <button id="btn-visible" class="capture-button" type="button">
      <span class="capture-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="m7 5 1.2-2h7.6L17 5"/></svg></span>
      <span class="capture-copy"><span id="txt-visible-title" class="capture-title"></span><span id="txt-visible-desc" class="capture-description"></span></span><span class="capture-arrow" aria-hidden="true">›</span>
    </button>
    <button id="btn-zone" class="capture-button" type="button">
      <span class="capture-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3v14a4 4 0 0 0 4 4h10M3 7h14a4 4 0 0 1 4 4v10"/><path d="m7 7-4-4m4 4L3 11m14 6 4-4m-4 4 4 4"/></svg></span>
      <span class="capture-copy"><span id="txt-zone-title" class="capture-title"></span><span id="txt-zone-desc" class="capture-description"></span></span><span class="capture-arrow" aria-hidden="true">›</span>
    </button>
    <button id="btn-scrolling" class="capture-button" type="button">
      <span class="capture-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3H4v4M17 3h3v4M7 21H4v-4M17 21h3v-4M5 9h14M5 15h14"/><path d="m12 6 2 2-2 2m0 4 2 2-2 2"/></svg></span>
      <span class="capture-copy"><span id="txt-scrolling-title" class="capture-title"></span><span id="txt-scrolling-desc" class="capture-description"></span></span><span class="capture-arrow" aria-hidden="true">›</span>
    </button>
  </main>

  <footer class="footer"><span id="shortcut-label"></span><button id="shortcut-button" class="shortcut-button" type="button"><kbd id="shortcut-value"></kbd></button></footer>

  <script src="capture-utils.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
